name: proof ores-stack #268 P2 terminal lifecycle

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/proof-ores-stack-268-p2-lifecycle.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proof-ores-stack-268-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_SHA: 393e858d87ea519dc7ab528a48d77335ce5f70db
    steps:
      - name: Require scoped source PAT
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"

      - name: Checkout exact ores-stack head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-stack
          ref: 393e858d87ea519dc7ab528a48d77335ce5f70db
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 1

      - name: Guard exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --short)"

      - name: Rust 1.88
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy

      - name: Configure authenticated Git dependencies
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
          echo 'CARGO_NET_GIT_FETCH_WITH_CLI=true' >> "$GITHUB_ENV"

      - name: Format
        run: cargo fmt --package ores-stack-p2-edge-minimal -- --check

      - name: Locked check
        run: cargo check --locked -p ores-stack-p2-edge-minimal --all-targets

      - name: Full P2 tests
        run: cargo test --locked -p ores-stack-p2-edge-minimal -- --nocapture

      - name: Strict Clippy
        run: cargo clippy --locked -p ores-stack-p2-edge-minimal --all-targets -- -D warnings

      - name: Source drift guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --short)"
          echo ORES_STACK_268_P2_LIFECYCLE_PROOF_PASS
