name: ores-stack-fn-adapters-rustfmt

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-fn-adapters-rustfmt.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  OUTPUT_BRANCH: 'fix/fn-adapters-rustfmt-baseline-20260922'

jobs:
  certify_and_push:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: Configure private source access
        shell: bash
        env: { ORE_SOURCE_PAT: '${{ secrets.ORE_SOURCE_PAT }}' }
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Checkout exact current main and guard output branch
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin main
          MAIN_SHA="$(git -C ores-stack rev-parse FETCH_HEAD)"
          printf '%s\n' "$MAIN_SHA" > "$RUNNER_TEMP/main-sha"
          git -C ores-stack checkout -b formatted "$MAIN_SHA"
          OUTPUT_SHA="$(git -C ores-stack ls-remote origin "refs/heads/$OUTPUT_BRANCH" | cut -f1)"
          test "$OUTPUT_SHA" = "$MAIN_SHA"
      - name: Apply Rust 1.88 formatting and certify adapter crate
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy
          cargo fmt --manifest-path crates/ores-fn-adapters/Cargo.toml
          changed="$(git diff --name-only | sort)"
          test -n "$changed"
          while IFS= read -r path; do
            case "$path" in
              crates/ores-fn-adapters/src/*.rs|crates/ores-fn-adapters/src/*/*.rs|crates/ores-fn-adapters/src/*/*/*.rs) ;;
              *) echo "unexpected rustfmt path: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          cargo fmt --manifest-path crates/ores-fn-adapters/Cargo.toml -- --check
          test ! -e crates/ores-fn-adapters/Cargo.lock
          cargo generate-lockfile --manifest-path crates/ores-fn-adapters/Cargo.toml
          cargo check --locked --manifest-path crates/ores-fn-adapters/Cargo.toml --all-targets
          cargo test --locked --manifest-path crates/ores-fn-adapters/Cargo.toml
          cargo clippy --locked --manifest-path crates/ores-fn-adapters/Cargo.toml --all-targets -- -D warnings
          rm crates/ores-fn-adapters/Cargo.lock
          git diff --check
          final="$(git diff --name-only | sort)"
          test "$final" = "$changed"
      - name: Guard main and push formatting branch
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          MAIN_SHA="$(cat "$RUNNER_TEMP/main-sha")"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_SHA"
          test "$(git ls-remote origin "refs/heads/$OUTPUT_BRANCH" | cut -f1)" = "$MAIN_SHA"
          git config user.name 'ORESoftware CI certification'
          git config user.email 'noreply@oresoftware.com'
          git add crates/ores-fn-adapters/src
          git commit -m 'style(lambda): rustfmt fn adapters on Rust 1.88'
          git push origin HEAD:"$OUTPUT_BRANCH"
