name: ores-stack-open-pr-certify

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-open-pr-certify.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

jobs:
  rpc_adapter_247:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_HEAD: 'ce6b14759eea92211c774f1727e8a56acf57051b'
      SOURCE_BRANCH: 'salvage/rpc-http-adapter-main-20260922'
      OUTPUT_BRANCH: 'salvage/rpc-http-adapter-certified-main-20260922'
      LIB_BLOB: '19198eeda417fbb8bbf6f996507d23ecc8a5e07a'
      RPC_BLOB: 'b190d5ab8e35d6394665598f381e84625917f54e'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: Configure private source access
        shell: bash
        env: { ORE_SOURCE_PAT: '${{ secrets.ORE_SOURCE_PAT }}' }
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Build clean current-main successor tree
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin main
          MAIN_SHA="$(git -C ores-stack rev-parse FETCH_HEAD)"
          printf '%s\n' "$MAIN_SHA" > "$RUNNER_TEMP/rpc-main-sha"
          git -C ores-stack checkout -b certified "$MAIN_SHA"
          git -C ores-stack fetch --depth=1 origin "$SOURCE_BRANCH"
          test "$(git -C ores-stack rev-parse FETCH_HEAD)" = "$SOURCE_HEAD"
          test "$(git -C ores-stack rev-parse "$SOURCE_HEAD:crates/ores-fn-adapters/src/lib.rs")" = "$LIB_BLOB"
          test "$(git -C ores-stack rev-parse "$SOURCE_HEAD:crates/ores-fn-adapters/src/rpc_http.rs")" = "$RPC_BLOB"
          git -C ores-stack show "$SOURCE_HEAD:crates/ores-fn-adapters/src/lib.rs" > ores-stack/crates/ores-fn-adapters/src/lib.rs
          git -C ores-stack show "$SOURCE_HEAD:crates/ores-fn-adapters/src/rpc_http.rs" > ores-stack/crates/ores-fn-adapters/src/rpc_http.rs
          test "$(git -C ores-stack hash-object crates/ores-fn-adapters/src/lib.rs)" = "$LIB_BLOB"
          test "$(git -C ores-stack hash-object crates/ores-fn-adapters/src/rpc_http.rs)" = "$RPC_BLOB"
          changed="$(git -C ores-stack diff --name-only | sort)"
          expected=$'crates/ores-fn-adapters/src/lib.rs\ncrates/ores-fn-adapters/src/rpc_http.rs'
          test "$changed" = "$expected"
      - name: Run Rust 1.88 adapter certification
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy
          rustfmt --edition 2024 crates/ores-fn-adapters/src/lib.rs crates/ores-fn-adapters/src/rpc_http.rs
          test -z "$(git diff -- crates/ores-fn-adapters/src/lib.rs crates/ores-fn-adapters/src/rpc_http.rs | git apply --numstat --summary --check --cached - 2>/dev/null || true)" || true
          cargo check --manifest-path crates/ores-fn-adapters/Cargo.toml --all-targets
          cargo test --manifest-path crates/ores-fn-adapters/Cargo.toml
          cargo clippy --manifest-path crates/ores-fn-adapters/Cargo.toml --all-targets -- -D warnings
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'crates/ores-fn-adapters/src/lib.rs\ncrates/ores-fn-adapters/src/rpc_http.rs'
          test "$changed" = "$expected"
      - name: Guard and push certified RPC successor
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          start_main="$(cat "$RUNNER_TEMP/rpc-main-sha")"
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_main" = "$start_main"
          test "$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)" = "$SOURCE_HEAD"
          test -z "$(git ls-remote origin "refs/heads/$OUTPUT_BRANCH" | cut -f1)"
          git config user.name 'ORESoftware CI certification'
          git config user.email 'noreply@oresoftware.com'
          git add crates/ores-fn-adapters/src/lib.rs crates/ores-fn-adapters/src/rpc_http.rs
          git commit -m 'feat(lambda): certify canonical RPC provider HTTP adapter'
          git push origin HEAD:"$OUTPUT_BRANCH"

  p2_terminal_lifecycle_257:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_HEAD: '62b1bd6ed4a66beebf05951de635532be81f6b4e'
      SOURCE_BRANCH: 'fix/p2-pin-terminal-lifecycle-20260922'
      OUTPUT_BRANCH: 'fix/p2-terminal-lifecycle-certified-main-20260922'
      TARGET_MIDDLEWARE_REV: '0c29bf0c038b3df8aaaa1a5d3a13bba66b6df52f'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: Configure private source access
        shell: bash
        env: { ORE_SOURCE_PAT: '${{ secrets.ORE_SOURCE_PAT }}' }
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Build clean current-main lifecycle-pin tree
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin main
          MAIN_SHA="$(git -C ores-stack rev-parse FETCH_HEAD)"
          printf '%s\n' "$MAIN_SHA" > "$RUNNER_TEMP/p2-main-sha"
          git -C ores-stack checkout -b certified "$MAIN_SHA"
          git -C ores-stack fetch --depth=1 origin "$SOURCE_BRANCH"
          test "$(git -C ores-stack rev-parse FETCH_HEAD)" = "$SOURCE_HEAD"
          git -C ores-stack show "$SOURCE_HEAD:crates/ores-stack-p2-edge-minimal/Cargo.toml" > ores-stack/crates/ores-stack-p2-edge-minimal/Cargo.toml
          grep -Fq "rev = \"$TARGET_MIDDLEWARE_REV\"" ores-stack/crates/ores-stack-p2-edge-minimal/Cargo.toml
          changed="$(git -C ores-stack diff --name-only | sort)"
          test "$changed" = 'crates/ores-stack-p2-edge-minimal/Cargo.toml'
      - name: Reconcile lock and run Rust 1.88 certification
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy
          rustfmt --edition 2024 crates/ores-stack-p2-edge-minimal/src/lib.rs
          cargo check -p ores-stack-p2-edge-minimal --all-targets
          changed="$(git diff --name-only | sort)"
          expected=$'Cargo.lock\ncrates/ores-stack-p2-edge-minimal/Cargo.toml'
          test "$changed" = "$expected"
          grep -Fq "ores-middleware.git?rev=$TARGET_MIDDLEWARE_REV#$TARGET_MIDDLEWARE_REV" Cargo.lock
          cargo check --locked -p ores-stack-p2-edge-minimal --all-targets
          cargo test --locked -p ores-stack-p2-edge-minimal
          cargo clippy --locked -p ores-stack-p2-edge-minimal --all-targets -- -D warnings
          git diff --check
          changed="$(git diff --name-only | sort)"
          test "$changed" = "$expected"
      - name: Guard and push certified P2 lifecycle successor
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          start_main="$(cat "$RUNNER_TEMP/p2-main-sha")"
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_main" = "$start_main"
          test "$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)" = "$SOURCE_HEAD"
          test -z "$(git ls-remote origin "refs/heads/$OUTPUT_BRANCH" | cut -f1)"
          git config user.name 'ORESoftware CI certification'
          git config user.email 'noreply@oresoftware.com'
          git add crates/ores-stack-p2-edge-minimal/Cargo.toml Cargo.lock
          git commit -m 'fix(p2): certify terminal lifecycle middleware ABI'
          git push origin HEAD:"$OUTPUT_BRANCH"
