name: ores-stack-ppr-final-hotfix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-ppr-final-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  OUTPUT_BRANCH: 'fix/ppr-request-ingress-mainline-repair-20260922'

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure private source access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Fetch current ores-stack main
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin main
          git -C ores-stack checkout -b repair FETCH_HEAD
          printf 'source_main=%s\n' "$(git -C ores-stack rev-parse HEAD)"
      - name: Apply exact request-ingress repairs
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          request='crates/ores-stack-ppr-http/src/request.rs'
          strict='crates/ores-stack-ppr-http/src/lib_strict.rs'

          old='with_tcp_deadline(stream, deadline, read_request_head)'
          new='with_tcp_deadline(stream, deadline, |reader| read_request_head(reader))'
          test "$(grep -F -c "$old" "$request")" = '1'
          sed -i "s#${old}#${new}#" "$request"

          test "$(grep -F -c 'pub fn write_response_head<W: Write>' "$strict")" = '2'
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/ores-stack-ppr-http/src/lib_strict.rs')
          text = path.read_text()
          marker = '/// Write one already-validated P3 response head through the canonical P1\n'
          first = text.index(marker)
          second = text.index(marker, first + len(marker))
          block = text[first:second]
          if text[second:second + len(block)] != block:
              raise SystemExit('duplicate response-head blocks differ; refusing automatic removal')
          path.write_text(text[:second] + text[second + len(block):])
          PY
          test "$(grep -F -c 'pub fn write_response_head<W: Write>' "$strict")" = '1'

          test "$(grep -F -c '    let mut headers = headers;' "$request")" = '1'
          sed -i '/^    let mut headers = headers;$/d' "$request"

      - name: Rust 1.88 and canonical format
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy
          rustfmt --edition 2024 crates/ores-stack-ppr-http/src/lib_strict.rs crates/ores-stack-ppr-http/src/request.rs
          rustfmt --edition 2024 --check crates/ores-stack-ppr-http/src/lib_strict.rs crates/ores-stack-ppr-http/src/request.rs
          git diff --check
      - name: Verify repaired PPR authority
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          bash scripts/bootstrap-cargo-lock.sh ensure
          cargo check --locked -p ores-stack-ppr-http --all-targets
          cargo test --locked -p ores-stack-ppr-http
          cargo clippy --locked -p ores-stack-ppr-http --all-targets -- -D warnings
      - name: Guard and push certified source branch
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected=$'crates/ores-stack-ppr-http/src/lib_strict.rs\ncrates/ores-stack-ppr-http/src/request.rs'
          printf 'changed:\n%s\n' "$changed"
          test "$changed" = "$expected"
          git config user.name 'ORESoftware CI repair'
          git config user.email 'noreply@oresoftware.com'
          git add crates/ores-stack-ppr-http/src/lib_strict.rs crates/ores-stack-ppr-http/src/request.rs
          git commit -m 'fix(ppr): repair merged request-ingress authority'
          test -z "$(git ls-remote origin "refs/heads/$OUTPUT_BRANCH" | cut -f1)" || {
            echo 'output branch already exists; refusing overwrite' >&2
            exit 1
          }
          git push origin HEAD:"$OUTPUT_BRANCH"
