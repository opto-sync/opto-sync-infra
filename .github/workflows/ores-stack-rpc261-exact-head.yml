name: ores-stack-rpc261-exact-head

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-rpc261-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  SOURCE_HEAD: '561d2722f7c2ae45e79c29be47d7e402b3c51e66'

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure private source access
        shell: bash
        env:
          ORE_SOURCE_PAT: '${{ secrets.ORE_SOURCE_PAT }}'
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Checkout exact ores-stack PR head
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin "$SOURCE_HEAD"
          git -C ores-stack checkout --detach FETCH_HEAD
          actual="$(git -C ores-stack rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$SOURCE_HEAD" "$actual"
          test "$actual" = "$SOURCE_HEAD"
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy
      - name: Certify adapter exact head
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          cargo fmt --manifest-path crates/ores-fn-adapters/Cargo.toml -- --check
          cargo check --manifest-path crates/ores-fn-adapters/Cargo.toml --all-targets
          cargo test --manifest-path crates/ores-fn-adapters/Cargo.toml
          cargo clippy --manifest-path crates/ores-fn-adapters/Cargo.toml --all-targets -- -D warnings
          git diff --check
          test -z "$(git status --porcelain)"
