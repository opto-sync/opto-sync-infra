name: ores-stack-adapter-rustfmt-hotfix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-adapter-rustfmt-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  EXPECTED_ORES_STACK_SHA: 'ebec1752123b77358342dfb3ca54c16986390501'
  OUTPUT_BRANCH: 'fix/fn-adapters-rustfmt-current-main-20260922'

jobs:
  repair_and_certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure private source access
        shell: bash
        env:
          ORE_SOURCE_PAT: '${{ secrets.ORE_SOURCE_PAT }}'
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Checkout exact ores-stack main epoch
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin "$EXPECTED_ORES_STACK_SHA"
          git -C ores-stack checkout -b repair FETCH_HEAD
          test "$(git -C ores-stack rev-parse HEAD)" = "$EXPECTED_ORES_STACK_SHA"
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy
      - name: Format adapter crate and confine diff
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          cargo fmt --manifest-path crates/ores-fn-adapters/Cargo.toml
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'crates/ores-fn-adapters/src/aws/direct.rs\ncrates/ores-fn-adapters/src/dispatch_input.rs\ncrates/ores-fn-adapters/src/gcp/http.rs'
          printf '%s\n' "$changed"
          test "$changed" = "$expected"
      - name: Certify formatted adapter crate
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          cargo check --manifest-path crates/ores-fn-adapters/Cargo.toml --all-targets
          cargo test --manifest-path crates/ores-fn-adapters/Cargo.toml
          cargo clippy --manifest-path crates/ores-fn-adapters/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path crates/ores-fn-adapters/Cargo.toml -- --check
          git diff --check
      - name: Push certified source hotfix
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_ORES_STACK_SHA"
          git config user.name 'ORESoftware CI repair'
          git config user.email 'noreply@oresoftware.com'
          git add crates/ores-fn-adapters/src/aws/direct.rs \
                  crates/ores-fn-adapters/src/dispatch_input.rs \
                  crates/ores-fn-adapters/src/gcp/http.rs
          git commit -m 'style(lambda): rustfmt provider adapter baseline'
          test -z "$(git ls-remote origin "refs/heads/$OUTPUT_BRANCH" | cut -f1)" || { echo 'output branch exists' >&2; exit 1; }
          git push origin HEAD:"$OUTPUT_BRANCH"
