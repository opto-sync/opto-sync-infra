name: proof ores-websocket 13 exact head

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/proof-ores-websocket-13.yml

permissions:
  contents: read

env:
  SOURCE_REPO: ORESoftware/ores-websocket
  SOURCE_BRANCH: fix/zpkg-universal-language-20260922
  SOURCE_SHA: 9c0391cf4e62921d557aec86eecedbdbd54ce8dd
  SOURCE_MAIN_SHA: 8cceeaf7142c469bc7ef55c16dc51ae0f9aeb43e

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require scoped source credential
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: test -n "$ORE_SOURCE_PAT"

      - name: Checkout exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-websocket
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 0

      - name: Guard exact manifest-only repair
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git cat-file -e "$SOURCE_MAIN_SHA^{commit}"
          mapfile -t changed < <(git diff --name-only "$SOURCE_MAIN_SHA" "$SOURCE_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".zpkg.toml"
          git diff --check "$SOURCE_MAIN_SHA" "$SOURCE_SHA"
          grep -F 'language = "universal"' .zpkg.toml
          ! grep -F 'language = "multi"' .zpkg.toml
          ! grep -Eq '^\[targets\.' .zpkg.toml
          grep -F 'test = "sh conformance/check.sh"' .zpkg.toml
          remote_branch=$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" "refs/heads/${SOURCE_BRANCH}" | cut -f1)
          remote_main=$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" refs/heads/main | cut -f1)
          test "$remote_branch" = "$SOURCE_SHA"
          test "$remote_main" = "$SOURCE_MAIN_SHA"

      - name: Install Rust 1.88 and pinned Zed CLI
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
          cargo install --git https://github.com/zed-pkg/zed-cli --rev 344d432a6f94d4b1cfa02228ec36623c7484177a --locked zed-cli

      - name: Validate and materialize corrected Zed package
        shell: bash
        env:
          ZED_PKG_GITHUB_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
          GITHUB_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          zed validate
          zed install --allow-build --install-mode copy
          zed validate --require-lock

      - name: Rust exact-head checks
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings

      - name: Node 22.9 source checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.9.0'

      - name: TypeScript and contract checks
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run check

      - name: Final exact-source guard
        if: always()
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          remote_branch=$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" "refs/heads/${SOURCE_BRANCH}" | cut -f1)
          remote_main=$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" refs/heads/main | cut -f1)
          test "$remote_branch" = "$SOURCE_SHA"
          test "$remote_main" = "$SOURCE_MAIN_SHA"
