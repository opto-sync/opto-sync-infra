name: proof ores-websocket #13 exact head

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/proof-ores-websocket-13.yml

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: 9c0391cf4e62921d557aec86eecedbdbd54ce8dd
      SOURCE_BASE: 8cceeaf7142c469bc7ef55c16dc51ae0f9aeb43e
      SOURCE_BRANCH: fix/zed-package-universal-root-20260922
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require source token
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: test -n "$ORE_SOURCE_PAT"
      - name: Checkout exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-websocket
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - name: Guard one-file manifest repair
        working-directory: subject
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git cat-file -e "$SOURCE_BASE^{commit}"
          git diff --check "$SOURCE_BASE"..HEAD
          test "$(git diff --name-only "$SOURCE_BASE"..HEAD)" = ".zpkg.toml"
          grep -F 'language = "universal"' .zpkg.toml
          ! grep -F 'language = "multi"' .zpkg.toml
          ! grep -F '[targets.' .zpkg.toml
          remote=$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/ORESoftware/ores-websocket.git" "refs/heads/${SOURCE_BRANCH}" | cut -f1)
          test "$remote" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
      - name: Configure private Git reads
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
          echo 'CARGO_NET_GIT_FETCH_WITH_CLI=true' >> "$GITHUB_ENV"
      - name: Install Rust 1.88
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
      - name: Install pinned Zed CLI
        shell: bash
        run: cargo install --git https://github.com/zed-pkg/zed-cli --rev 344d432a6f94d4b1cfa02228ec36623c7484177a --locked zed-cli
      - name: Validate Zed manifest without registry materialization
        working-directory: subject
        run: zed validate --manifest .zpkg.toml --lock .zpkg.lock --require-lock
      - name: Rustfmt
        working-directory: subject
        run: cargo fmt --all -- --check
      - name: Rust tests and Clippy
        working-directory: subject
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo test --all-features
          cargo clippy --all-features --all-targets -- -D warnings
      - name: TypeScript and contract checks from direct source dependencies
        working-directory: subject
        shell: bash
        run: |
          set -Eeuo pipefail
          node --version
          npm --version
          npm ci
          npm run check
      - name: Final immutable-source guard
        if: always()
        working-directory: subject
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          remote=$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/ORESoftware/ores-websocket.git" "refs/heads/${SOURCE_BRANCH}" | cut -f1)
          test "$remote" = "$SOURCE_SHA"
          git diff --exit-code
