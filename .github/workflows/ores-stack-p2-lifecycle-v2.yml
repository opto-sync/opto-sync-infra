name: ores-stack-p2-lifecycle-v2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-p2-lifecycle-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  OUTPUT_BRANCH: 'feat/p2-edge-minimal-lifecycle-v2-20260922'

jobs:
  build_certify_push:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: Configure private source access
        shell: bash
        env: { ORE_SOURCE_PAT: '${{ secrets.ORE_SOURCE_PAT }}' }
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Checkout exact current main
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin main
          MAIN_SHA="$(git -C ores-stack rev-parse FETCH_HEAD)"
          printf '%s\n' "$MAIN_SHA" > "$RUNNER_TEMP/main-sha"
          git -C ores-stack checkout -b lifecycle "$MAIN_SHA"
          test -z "$(git -C ores-stack ls-remote origin "refs/heads/$OUTPUT_BRANCH" | cut -f1)"
      - name: Add additive lifecycle v2 protocol
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/ores-stack-p2-edge-minimal/src/lib.rs')
          text = p.read_text()
          marker = '#![forbid(unsafe_code)]\n'
          insertion = '#![forbid(unsafe_code)]\n\nmod lifecycle;\npub use lifecycle::*;\n'
          if 'mod lifecycle;' in text:
              raise SystemExit('lifecycle module already present')
          if not text.startswith(marker):
              raise SystemExit('unexpected p2 lib header')
          p.write_text(text.replace(marker, insertion, 1))
          PY
          cat > crates/ores-stack-p2-edge-minimal/src/lifecycle.rs <<'RS'
          use crate::{
              MAX_CONTROL_FRAME_BYTES, MAX_SHORT_CIRCUIT_BODY_BYTES,
              MIDDLEWARE_EXECUTION_FAILED_CODE,
          };
          use ores_middleware::{
              EdgeMinimalMiddleware, EdgeMinimalTerminalReport, LocalEdgeMinimalLifecycleHost,
              LocalEdgeMinimalResult, MIDDLEWARE_HOST_ABI_SCHEMA, MiddlewareHostOutcome,
              MiddlewareHostRequest, RequestContext, RequestMetadata,
          };
          use serde::{Deserialize, Serialize};
          use std::{
              collections::BTreeMap,
              io::{BufRead, Read, Write},
          };

          pub const P2_EDGE_MINIMAL_LIFECYCLE_SCHEMA: &str =
              "ores.stack.p2.edge_minimal.lifecycle/v2";
          pub const MIDDLEWARE_FINALIZATION_FAILED_CODE: &str =
              "middleware_finalization_failed";

          #[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]
          #[serde(tag = "kind", rename_all = "snake_case", deny_unknown_fields)]
          pub enum LifecycleInputFrame {
              Begin {
                  schema: String,
                  request: MiddlewareHostRequest,
                  context: RequestContext,
              },
              Finish {
                  schema: String,
                  outcome: MiddlewareHostOutcome,
                  status: Option<u16>,
                  response_bytes: u64,
                  elapsed_ms: u64,
              },
          }

          impl LifecycleInputFrame {
              #[must_use]
              pub fn begin(request: MiddlewareHostRequest, context: RequestContext) -> Self {
                  Self::Begin {
                      schema: P2_EDGE_MINIMAL_LIFECYCLE_SCHEMA.to_owned(),
                      request,
                      context,
                  }
              }

              #[must_use]
              pub fn finish(
                  outcome: MiddlewareHostOutcome,
                  status: Option<u16>,
                  response_bytes: u64,
                  elapsed_ms: u64,
              ) -> Self {
                  Self::Finish {
                      schema: P2_EDGE_MINIMAL_LIFECYCLE_SCHEMA.to_owned(),
                      outcome,
                      status,
                      response_bytes,
                      elapsed_ms,
                  }
              }
          }

          #[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]
          #[serde(tag = "kind", rename_all = "snake_case", deny_unknown_fields)]
          pub enum LifecycleOutputFrame {
              Continue {
                  schema: String,
                  session_id: String,
                  request: MiddlewareHostRequest,
              },
              Respond {
                  schema: String,
                  session_id: String,
                  status: u16,
                  headers: BTreeMap<String, String>,
                  body: Vec<u8>,
              },
              Finished {
                  schema: String,
                  session_id: String,
              },
              MiddlewareError {
                  schema: String,
                  code: String,
              },
              ProtocolError {
                  schema: String,
                  code: String,
              },
          }

          pub async fn run_stdio_lifecycle<R, W, M>(
              host: &LocalEdgeMinimalLifecycleHost<M>,
              mut input: R,
              mut output: W,
          ) -> Result<(), String>
          where
              R: BufRead,
              W: Write,
              M: EdgeMinimalMiddleware,
          {
              let first = match read_lifecycle_input_frame(&mut input) {
                  Ok(frame) => frame,
                  Err(code) => return protocol_error(&mut output, &code),
              };
              let LifecycleInputFrame::Begin {
                  schema,
                  request,
                  context,
              } = first
              else {
                  return protocol_error(&mut output, "first_frame_must_be_begin");
              };
              validate_schema(&schema).or_else(|code| protocol_error(&mut output, code))?;
              request
                  .validate()
                  .map_err(|_| "invalid_middleware_host_request".to_owned())
                  .or_else(|code| protocol_error(&mut output, &code))?;

              let begin = match host.begin(request, context).await {
                  Ok(begin) => begin,
                  Err(error) => {
                      let internal_code = error.code;
                      write_lifecycle_output_frame(
                          &mut output,
                          &LifecycleOutputFrame::MiddlewareError {
                              schema: P2_EDGE_MINIMAL_LIFECYCLE_SCHEMA.to_owned(),
                              code: MIDDLEWARE_EXECUTION_FAILED_CODE.to_owned(),
                          },
                      )?;
                      return Err(format!("middleware execution failed ({internal_code})"));
                  }
              };

              let session_id = begin.session_id;
              match begin.result {
                  LocalEdgeMinimalResult::Continue(request) => write_lifecycle_output_frame(
                      &mut output,
                      &LifecycleOutputFrame::Continue {
                          schema: P2_EDGE_MINIMAL_LIFECYCLE_SCHEMA.to_owned(),
                          session_id: session_id.clone(),
                          request: metadata_to_host_request(request),
                      },
                  )?,
                  LocalEdgeMinimalResult::Respond(response) => {
                      if response.body.len() > MAX_SHORT_CIRCUIT_BODY_BYTES {
                          return protocol_error(&mut output, "short_circuit_body_too_large");
                      }
                      write_lifecycle_output_frame(
                          &mut output,
                          &LifecycleOutputFrame::Respond {
                              schema: P2_EDGE_MINIMAL_LIFECYCLE_SCHEMA.to_owned(),
                              session_id: session_id.clone(),
                              status: response.status,
                              headers: response.headers,
                              body: response.body,
                          },
                      )?;
                  }
              }

              let second = match read_lifecycle_input_frame(&mut input) {
                  Ok(frame) => frame,
                  Err(code) => return protocol_error(&mut output, &code),
              };
              let LifecycleInputFrame::Finish {
                  schema,
                  outcome,
                  status,
                  response_bytes,
                  elapsed_ms,
              } = second
              else {
                  return protocol_error(&mut output, "second_frame_must_be_finish");
              };
              validate_schema(&schema).or_else(|code| protocol_error(&mut output, code))?;

              let report = EdgeMinimalTerminalReport {
                  session_id: session_id.clone(),
                  outcome,
                  status,
                  response_bytes,
                  elapsed_ms,
              };
              report
                  .validate()
                  .map_err(|_| "invalid_terminal_report".to_owned())
                  .or_else(|code| protocol_error(&mut output, &code))?;

              if let Err(error) = host.finish(report).await {
                  let internal_code = error.code;
                  write_lifecycle_output_frame(
                      &mut output,
                      &LifecycleOutputFrame::MiddlewareError {
                          schema: P2_EDGE_MINIMAL_LIFECYCLE_SCHEMA.to_owned(),
                          code: MIDDLEWARE_FINALIZATION_FAILED_CODE.to_owned(),
                      },
                  )?;
                  return Err(format!("middleware finalization failed ({internal_code})"));
              }

              write_lifecycle_output_frame(
                  &mut output,
                  &LifecycleOutputFrame::Finished {
                      schema: P2_EDGE_MINIMAL_LIFECYCLE_SCHEMA.to_owned(),
                      session_id,
                  },
              )
          }

          pub fn read_lifecycle_input_frame<R: BufRead>(
              input: &mut R,
          ) -> Result<LifecycleInputFrame, String> {
              let mut line = String::new();
              let read = input
                  .take((MAX_CONTROL_FRAME_BYTES + 2) as u64)
                  .read_line(&mut line)
                  .map_err(|_| "control_frame_read_failed".to_owned())?;
              if read == 0 {
                  return Err("control_stream_ended".to_owned());
              }
              if !line.ends_with('\n') {
                  if line.len() > MAX_CONTROL_FRAME_BYTES {
                      return Err("control_frame_too_large".to_owned());
                  }
                  return Err("control_frame_unterminated".to_owned());
              }
              let payload = line
                  .strip_suffix('\n')
                  .expect("newline checked")
                  .strip_suffix('\r')
                  .unwrap_or_else(|| line.strip_suffix('\n').expect("newline checked"));
              if payload.len() > MAX_CONTROL_FRAME_BYTES {
                  return Err("control_frame_too_large".to_owned());
              }
              serde_json::from_str(payload).map_err(|_| "control_frame_invalid_json".to_owned())
          }

          pub fn write_lifecycle_output_frame<W: Write>(
              output: &mut W,
              frame: &LifecycleOutputFrame,
          ) -> Result<(), String> {
              let encoded =
                  serde_json::to_vec(frame).map_err(|_| "control_frame_encode_failed".to_owned())?;
              if encoded.len() > MAX_CONTROL_FRAME_BYTES {
                  return Err("control_frame_too_large".to_owned());
              }
              output
                  .write_all(&encoded)
                  .and_then(|()| output.write_all(b"\n"))
                  .and_then(|()| output.flush())
                  .map_err(|_| "control_frame_write_failed".to_owned())
          }

          fn validate_schema(schema: &str) -> Result<(), &'static str> {
              if schema == P2_EDGE_MINIMAL_LIFECYCLE_SCHEMA {
                  Ok(())
              } else {
                  Err("unsupported_protocol_schema")
              }
          }

          fn protocol_error<W: Write>(output: &mut W, code: &str) -> Result<(), String> {
              write_lifecycle_output_frame(
                  output,
                  &LifecycleOutputFrame::ProtocolError {
                      schema: P2_EDGE_MINIMAL_LIFECYCLE_SCHEMA.to_owned(),
                      code: code.to_owned(),
                  },
              )?;
              Err(code.to_owned())
          }

          fn metadata_to_host_request(request: RequestMetadata) -> MiddlewareHostRequest {
              MiddlewareHostRequest {
                  schema: MIDDLEWARE_HOST_ABI_SCHEMA.to_owned(),
                  method: request.method,
                  path: request.path,
                  headers: request.headers,
                  trusted_remote_ip: request.remote_ip,
                  content_length: request.content_length,
                  trusted_transport_secure: request.transport_secure,
              }
          }

          #[cfg(test)]
          mod tests {
              use super::*;
              use ores_middleware::{
                  AuthDecision, AuthVerifier, EdgeMiddlewareDependencies, EdgeMinimalCallbackArgs,
                  EdgeMinimalDecision, IntegrationError, MiddlewareCacheProvider,
                  MiddlewareFetchProvider, MiddlewareFetchRequest, MiddlewareFetchResponse,
                  RateLimiter, ResponseMetadata, TelemetrySink, edge_minimal_finalizer_fn,
                  edge_minimal_middleware_fn,
              };
              use std::{
                  future::Future,
                  io::Cursor,
                  pin::Pin,
                  sync::{Arc, Mutex},
              };

              type BoxFuture<'a, T> = Pin<Box<dyn Future<Output = T> + Send + 'a>>;

              struct Fetch;
              impl MiddlewareFetchProvider for Fetch {
                  fn fetch<'a>(
                      &'a self,
                      _request: MiddlewareFetchRequest,
                  ) -> BoxFuture<'a, Result<MiddlewareFetchResponse, IntegrationError>> {
                      Box::pin(async {
                          Ok(MiddlewareFetchResponse {
                              status: 204,
                              headers: BTreeMap::new(),
                              body: Vec::new(),
                          })
                      })
                  }
              }

              struct Auth;
              impl AuthVerifier for Auth {
                  fn verify<'a>(
                      &'a self,
                      _request: &'a RequestMetadata,
                  ) -> BoxFuture<'a, Result<AuthDecision, IntegrationError>> {
                      Box::pin(async { Ok(AuthDecision::default()) })
                  }
              }

              struct Limiter;
              impl RateLimiter for Limiter {
                  fn allow<'a>(
                      &'a self,
                      _key: &'a str,
                      _capacity: u32,
                      _refill_per_second: f64,
                  ) -> BoxFuture<'a, bool> {
                      Box::pin(async { true })
                  }
              }

              struct Cache;
              impl MiddlewareCacheProvider for Cache {
                  fn get<'a>(
                      &'a self,
                      _key: &'a str,
                  ) -> BoxFuture<'a, Result<Option<Vec<u8>>, IntegrationError>> {
                      Box::pin(async { Ok(None) })
                  }

                  fn set<'a>(
                      &'a self,
                      _key: &'a str,
                      _value: Vec<u8>,
                      _ttl_ms: Option<u64>,
                  ) -> BoxFuture<'a, Result<(), IntegrationError>> {
                      Box::pin(async { Ok(()) })
                  }

                  fn delete<'a>(
                      &'a self,
                      _key: &'a str,
                  ) -> BoxFuture<'a, Result<(), IntegrationError>> {
                      Box::pin(async { Ok(()) })
                  }
              }

              struct Telemetry;
              impl TelemetrySink for Telemetry {
                  fn request_started<'a>(
                      &'a self,
                      _context: &'a RequestContext,
                      _request: &'a RequestMetadata,
                  ) -> BoxFuture<'a, ()> {
                      Box::pin(async {})
                  }

                  fn request_finished<'a>(
                      &'a self,
                      _context: &'a RequestContext,
                      _request: &'a RequestMetadata,
                      _response: &'a ResponseMetadata,
                  ) -> BoxFuture<'a, ()> {
                      Box::pin(async {})
                  }
              }

              fn deps() -> EdgeMiddlewareDependencies {
                  EdgeMiddlewareDependencies::new(
                      Arc::new(Fetch),
                      Arc::new(Auth),
                      Arc::new(Limiter),
                      Arc::new(Cache),
                      Arc::new(Telemetry),
                  )
              }

              fn context() -> RequestContext {
                  RequestContext {
                      request_id: "req-lifecycle-wire".to_owned(),
                      trace_id: "trace-lifecycle-wire".to_owned(),
                      span_id: None,
                      tenant_id: None,
                      user_id: None,
                      locale: None,
                      started_at_unix_ms: 0,
                      deadline_unix_ms: None,
                      baggage: BTreeMap::new(),
                  }
              }

              fn secure_request(path: &str) -> MiddlewareHostRequest {
                  let mut request = MiddlewareHostRequest::new("GET", path);
                  request.trusted_transport_secure = true;
                  request
              }

              fn encoded_input(frames: &[LifecycleInputFrame]) -> Cursor<Vec<u8>> {
                  let mut bytes = Vec::new();
                  for frame in frames {
                      bytes.extend(serde_json::to_vec(frame).expect("encode"));
                      bytes.push(b'\n');
                  }
                  Cursor::new(bytes)
              }

              fn output_frames(bytes: &[u8]) -> Vec<LifecycleOutputFrame> {
                  std::str::from_utf8(bytes)
                      .expect("utf8")
                      .lines()
                      .map(|line| serde_json::from_str(line).expect("output frame"))
                      .collect()
              }

              #[tokio::test]
              async fn completed_request_runs_metadata_only_finalizer() {
                  let middleware = edge_minimal_middleware_fn(
                      |mut args: EdgeMinimalCallbackArgs| async move {
                          args.set_request_header("x-ores-p2", "ok");
                          Ok(EdgeMinimalDecision::Continue(args.request))
                      },
                  );
                  let observed = Arc::new(Mutex::new(Vec::new()));
                  let observed_by_finalizer = observed.clone();
                  let finalizer = edge_minimal_finalizer_fn(move |args| {
                      let observed = observed_by_finalizer.clone();
                      async move {
                          observed.lock().expect("observed").push((
                              args.outcome,
                              args.status,
                              args.response_bytes,
                              args.elapsed_ms,
                          ));
                          Ok(())
                      }
                  });
                  let host = LocalEdgeMinimalLifecycleHost::with_finalizer(
                      Arc::new(middleware),
                      deps(),
                      Arc::new(finalizer),
                  );
                  let input = encoded_input(&[
                      LifecycleInputFrame::begin(secure_request("/v1/rpc"), context()),
                      LifecycleInputFrame::finish(
                          MiddlewareHostOutcome::Completed,
                          Some(200),
                          17,
                          9,
                      ),
                  ]);
                  let mut output = Vec::new();

                  run_stdio_lifecycle(&host, input, &mut output)
                      .await
                      .expect("lifecycle run");

                  let frames = output_frames(&output);
                  assert_eq!(frames.len(), 2);
                  let LifecycleOutputFrame::Continue {
                      session_id,
                      request,
                      ..
                  } = &frames[0]
                  else {
                      panic!("expected continue");
                  };
                  assert!(!session_id.is_empty());
                  assert_eq!(
                      request.headers.get("x-ores-p2").map(String::as_str),
                      Some("ok")
                  );
                  assert!(matches!(
                      &frames[1],
                      LifecycleOutputFrame::Finished { session_id: finished, .. }
                          if finished == session_id
                  ));
                  assert_eq!(
                      observed.lock().expect("observed").as_slice(),
                      &[(MiddlewareHostOutcome::Completed, Some(200), 17, 9)]
                  );
              }

              #[tokio::test]
              async fn timeout_does_not_require_fabricated_status() {
                  let middleware = edge_minimal_middleware_fn(|args| async move {
                      Ok(EdgeMinimalDecision::Continue(args.request))
                  });
                  let observed = Arc::new(Mutex::new(Vec::new()));
                  let observed_by_finalizer = observed.clone();
                  let finalizer = edge_minimal_finalizer_fn(move |args| {
                      let observed = observed_by_finalizer.clone();
                      async move {
                          observed
                              .lock()
                              .expect("observed")
                              .push((args.outcome, args.status));
                          Ok(())
                      }
                  });
                  let host = LocalEdgeMinimalLifecycleHost::with_finalizer(
                      Arc::new(middleware),
                      deps(),
                      Arc::new(finalizer),
                  );
                  let input = encoded_input(&[
                      LifecycleInputFrame::begin(secure_request("/slow"), context()),
                      LifecycleInputFrame::finish(
                          MiddlewareHostOutcome::TimedOut,
                          None,
                          0,
                          90_000,
                      ),
                  ]);
                  let mut output = Vec::new();

                  run_stdio_lifecycle(&host, input, &mut output)
                      .await
                      .expect("timeout lifecycle");

                  assert_eq!(
                      observed.lock().expect("observed").as_slice(),
                      &[(MiddlewareHostOutcome::TimedOut, None)]
                  );
              }

              #[tokio::test]
              async fn second_begin_fails_closed_after_admission() {
                  let middleware = edge_minimal_middleware_fn(|args| async move {
                      Ok(EdgeMinimalDecision::Continue(args.request))
                  });
                  let host = LocalEdgeMinimalLifecycleHost::from_middleware(middleware, deps());
                  let input = encoded_input(&[
                      LifecycleInputFrame::begin(secure_request("/"), context()),
                      LifecycleInputFrame::begin(secure_request("/again"), context()),
                  ]);
                  let mut output = Vec::new();

                  let error = run_stdio_lifecycle(&host, input, &mut output)
                      .await
                      .expect_err("second begin must fail");
                  assert_eq!(error, "second_frame_must_be_finish");
                  let frames = output_frames(&output);
                  assert!(matches!(frames[0], LifecycleOutputFrame::Continue { .. }));
                  assert!(matches!(
                      &frames[1],
                      LifecycleOutputFrame::ProtocolError { code, .. }
                          if code == "second_frame_must_be_finish"
                  ));
              }

              #[tokio::test]
              async fn oversized_control_frame_is_bounded_while_reading() {
                  let mut input = Cursor::new(format!("{}\n", "x".repeat(MAX_CONTROL_FRAME_BYTES + 16)));
                  assert_eq!(
                      read_lifecycle_input_frame(&mut input).expect_err("oversized frame"),
                      "control_frame_too_large"
                  );
              }
          }
          RS
      - name: Rust 1.88 format check test clippy
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy
          rustfmt --edition 2024 crates/ores-stack-p2-edge-minimal/src/lib.rs crates/ores-stack-p2-edge-minimal/src/lifecycle.rs
          cargo fmt --manifest-path crates/ores-stack-p2-edge-minimal/Cargo.toml -- --check
          cargo check --locked -p ores-stack-p2-edge-minimal --all-targets
          cargo test --locked -p ores-stack-p2-edge-minimal
          cargo clippy --locked -p ores-stack-p2-edge-minimal --all-targets -- -D warnings
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'crates/ores-stack-p2-edge-minimal/src/lib.rs\ncrates/ores-stack-p2-edge-minimal/src/lifecycle.rs'
          test "$changed" = "$expected"
      - name: Guard main and push certified branch
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          MAIN_SHA="$(cat "$RUNNER_TEMP/main-sha")"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_SHA"
          test -z "$(git ls-remote origin "refs/heads/$OUTPUT_BRANCH" | cut -f1)"
          git config user.name 'ORESoftware CI certification'
          git config user.email 'noreply@oresoftware.com'
          git add crates/ores-stack-p2-edge-minimal/src/lib.rs crates/ores-stack-p2-edge-minimal/src/lifecycle.rs
          git commit -m 'feat(p2): add edge-minimal terminal lifecycle protocol v2'
          git push origin HEAD:"$OUTPUT_BRANCH"
