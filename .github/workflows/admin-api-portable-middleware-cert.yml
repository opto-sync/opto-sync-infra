name: admin-api-portable-middleware-cert

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/admin-api-portable-middleware-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

jobs:
  admin_api_exact_head:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURCE_REPO: 'ORESoftware/admin-api-server-template.rs'
      SOURCE_BRANCH: 'feat/portable-edge-middleware-hook-20260922'
      SOURCE_HEAD: '849e51435c2a30a4626fab151ec41e610ebc276b'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: Configure private source access
        shell: bash
        env: { ORE_SOURCE_PAT: '${{ secrets.ORE_SOURCE_PAT }}' }
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Fetch exact admin API PR head
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "https://github.com/${SOURCE_REPO}.git"
          git -C source fetch --depth=1 origin "$SOURCE_BRANCH"
          test "$(git -C source rev-parse FETCH_HEAD)" = "$SOURCE_HEAD"
          git -C source checkout -b certified "$SOURCE_HEAD"
      - name: Certify portable middleware boundary
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy
          rustfmt --edition 2024 --config skip_children=true --check src/middleware/mod.rs src/middleware/mw.rs
          cargo check --all-targets
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
          git diff --check
          rm -f Cargo.lock
          test -z "$(git diff --name-only)"
