name: 'ores-stack #261 RPC HTTP adapter repair'

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-rpc247-certify.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  SOURCE_HEAD: 'a6fb3c574f09991ace7e78bad7ec74aa8163a6e5'
  SOURCE_BRANCH: 'salvage/rpc-http-adapter-main2-20260922'

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure private source access
        shell: bash
        env:
          ORE_SOURCE_PAT: '${{ secrets.ORE_SOURCE_PAT }}'
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Checkout exact ores-stack PR head
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin "$SOURCE_BRANCH"
          test "$(git -C ores-stack rev-parse FETCH_HEAD)" = "$SOURCE_HEAD"
          git -C ores-stack checkout -b repair "$SOURCE_HEAD"
          test -f ores-stack/crates/ores-fn-adapters/src/rpc_http.rs
          test -z "$(git -C ores-stack status --short)"

      - name: Run Rust 1.88 exact-head repair and certification
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy

          rustfmt --edition 2024 crates/ores-fn-adapters/src/lib.rs crates/ores-fn-adapters/src/rpc_http.rs
          cargo generate-lockfile --manifest-path crates/ores-fn-adapters/Cargo.toml
          cargo check --manifest-path crates/ores-fn-adapters/Cargo.toml --locked --all-targets
          cargo test --manifest-path crates/ores-fn-adapters/Cargo.toml --locked
          cargo clippy --manifest-path crates/ores-fn-adapters/Cargo.toml --locked --all-targets -- -D warnings

          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'crates/ores-fn-adapters/src/lib.rs\ncrates/ores-fn-adapters/src/rpc_http.rs'
          if [ -n "$changed" ]; then
            test "$changed" = "$expected"
          fi
          test "$(git status --short | sed '/?? crates\/ores-fn-adapters\/Cargo.lock/d')" = "$(git status --short --untracked-files=no)"

      - name: Guard and fast-forward source PR branch
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)" = "$SOURCE_HEAD"
          git config user.name 'ORESoftware CI certification'
          git config user.email 'noreply@oresoftware.com'
          git add crates/ores-fn-adapters/src/lib.rs crates/ores-fn-adapters/src/rpc_http.rs
          if git diff --cached --quiet; then
            echo ORES_STACK_261_ALREADY_FORMATTED_AND_GREEN
            exit 0
          fi
          git commit -m 'style(lambda): rustfmt canonical RPC HTTP adapter'
          git push origin HEAD:"$SOURCE_BRANCH"
          echo ORES_STACK_261_REPAIRED_AND_GREEN
