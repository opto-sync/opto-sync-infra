name: ores-stack-p2-lifecycle-proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-p2-lifecycle-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  SOURCE_BRANCH: 'feat/ppr-p2-terminal-lifecycle-20260922'
  SOURCE_SHA: '393e858d87ea519dc7ab528a48d77335ce5f70db'

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure private source access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Fetch exact ores-stack candidate
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin "$SOURCE_BRANCH"
          git -C ores-stack checkout -b repair FETCH_HEAD
          actual="$(git -C ores-stack rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$SOURCE_SHA" "$actual"
          test "$actual" = "$SOURCE_SHA"
      - name: Apply demonstrated lifecycle layout repair
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/ores-stack-p2-edge-minimal/src/lib.rs')
          text = path.read_text()
          replacements = [
              (
                  '        request: MiddlewareHostRequest,\n        context: RequestContext,',
                  '        request: Box<MiddlewareHostRequest>,\n        context: Box<RequestContext>,',
                  'LifecycleInputFrame begin fields',
              ),
              (
                  '            request,\n            context,',
                  '            request: Box::new(request),\n            context: Box::new(context),',
                  'lifecycle begin constructor',
              ),
              (
                  '            (request, context)\n',
                  '            (*request, *context)\n',
                  'lifecycle begin handoff',
              ),
          ]
          for old, new, label in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one {label}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Install Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy
          rustc --version
          cargo --version
      - name: Format and verify P2 lifecycle protocol
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          rustfmt --edition 2024 crates/ores-stack-p2-edge-minimal/src/lib.rs
          rustfmt --edition 2024 --check crates/ores-stack-p2-edge-minimal/src/lib.rs
          bash scripts/bootstrap-cargo-lock.sh ensure
          cargo check --locked -p ores-stack-p2-edge-minimal --all-targets
          cargo test --locked -p ores-stack-p2-edge-minimal
          cargo clippy --locked -p ores-stack-p2-edge-minimal --all-targets -- -D warnings
          git diff --check
      - name: Guard and push certified source repair
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          changed="$(git status --porcelain | sed -E 's/^...//' | sort -u)"
          test "$changed" = 'crates/ores-stack-p2-edge-minimal/src/lib.rs'
          remote_head="$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)"
          test "$remote_head" = "$SOURCE_SHA"
          git config user.name 'ORESoftware CI repair'
          git config user.email 'noreply@oresoftware.com'
          git add crates/ores-stack-p2-edge-minimal/src/lib.rs
          git commit -m 'fix(ppr): bound lifecycle control-frame enum size'
          git push origin HEAD:"$SOURCE_BRANCH"
