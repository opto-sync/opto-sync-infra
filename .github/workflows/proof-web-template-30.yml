name: proof web-template #30 exact head

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/proof-web-template-30.yml

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: 653ad80add67fdaf91f9dd0b8c52e4db3d38f160
      SOURCE_BASE: 97aec1181120c99dc59dc69cc769c5b5e2524927
      SOURCE_BRANCH: feat/portable-edge-middleware-hook-20260922
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require source token
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: test -n "$ORE_SOURCE_PAT"
      - name: Checkout exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-web-server.template.rs
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - name: Guard exact review surface and middleware authority
        working-directory: subject
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git cat-file -e "$SOURCE_BASE^{commit}"
          git diff --check "$SOURCE_BASE"..HEAD
          expected=$'.ores-config-authorities.json\nCargo.toml\ndocs/middleware-wrapper.md\ndocs/telemetry-runtime.md\nsrc/lib.rs\nsrc/middleware/README.md\nsrc/middleware/mod.rs\nsrc/middleware/mw.rs\ntests/authority_lock.rs\ntests/contract_alignment.rs'
          test "$(git diff --name-only "$SOURCE_BASE"..HEAD | sort)" = "$(printf '%s\n' "$expected" | sort)"
          test "$(grep -o '0c29bf0c038b3df8aaaa1a5d3a13bba66b6df52f' Cargo.toml | wc -l)" -eq 1
          test "$(grep -o '0c29bf0c038b3df8aaaa1a5d3a13bba66b6df52f' .ores-config-authorities.json | wc -l)" -eq 2
          grep -F 'MiddlewareExecutionProfile::EdgeMinimal' src/middleware/mw.rs
          grep -F 'pub async fn edge_minimal' src/middleware/mw.rs
          grep -F 'pub fn configure_backend' src/middleware/mw.rs
          remote=$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/ORESoftware/ores-web-server.template.rs.git" "refs/heads/${SOURCE_BRANCH}" | cut -f1)
          test "$remote" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
      - name: Install Rust 1.88
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
      - name: Configure private Cargo Git access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
          echo 'CARGO_NET_GIT_FETCH_WITH_CLI=true' >> "$GITHUB_ENV"
      - name: Validate policy JSON and Cargo metadata
        working-directory: subject
        shell: bash
        run: |
          set -Eeuo pipefail
          jq empty .ores-config-authorities.json config/ores-middleware-stack.json
          cargo metadata --no-deps --format-version 1 >/dev/null
      - name: Format changed Rust authorities
        working-directory: subject
        shell: bash
        run: rustfmt --edition 2024 --check src/middleware/mod.rs src/middleware/mw.rs tests/authority_lock.rs tests/contract_alignment.rs
      - name: Authority lock integrity
        working-directory: subject
        run: cargo test --test authority_lock
      - name: Contract alignment
        working-directory: subject
        run: cargo test --test contract_alignment
      - name: Test all targets
        working-directory: subject
        run: cargo test --all-targets
      - name: Strict Clippy
        working-directory: subject
        run: cargo clippy --all-targets -- -D warnings
      - name: Release build
        working-directory: subject
        run: cargo build --release --bin ores-web-server-template
      - name: Final immutable-source guard
        if: always()
        working-directory: subject
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          remote=$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/ORESoftware/ores-web-server.template.rs.git" "refs/heads/${SOURCE_BRANCH}" | cut -f1)
          test "$remote" = "$SOURCE_SHA"
          git diff --exit-code
