name: ores-stack-rpc261-current-main

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-rpc261-current-main.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  EXPECTED_MAIN_SHA: '9114d3db54dc140fbc09f1f7672ba86dc1736c64'
  SOURCE_HEAD: '561d2722f7c2ae45e79c29be47d7e402b3c51e66'
  SOURCE_BRANCH: 'salvage/rpc-http-adapter-main2-20260922'
  OUTPUT_BRANCH: 'salvage/rpc-http-adapter-certified-main3-20260922'
  LIB_BLOB: 'fa806657e08c23a882dbe40008b69568bdb99e09'
  RPC_BLOB: '14b806661cd0908079ff8ab0e699dd6c085d6c5c'

jobs:
  certify_and_push:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure private source access
        shell: bash
        env:
          ORE_SOURCE_PAT: '${{ secrets.ORE_SOURCE_PAT }}'
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Build exact current-main successor tree
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin "$EXPECTED_MAIN_SHA"
          git -C ores-stack checkout -b certified FETCH_HEAD
          test "$(git -C ores-stack rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          git -C ores-stack fetch --depth=1 origin "$SOURCE_HEAD"
          test "$(git -C ores-stack rev-parse FETCH_HEAD)" = "$SOURCE_HEAD"
          git -C ores-stack show "$SOURCE_HEAD:crates/ores-fn-adapters/src/lib.rs" > ores-stack/crates/ores-fn-adapters/src/lib.rs
          git -C ores-stack show "$SOURCE_HEAD:crates/ores-fn-adapters/src/rpc_http.rs" > ores-stack/crates/ores-fn-adapters/src/rpc_http.rs
          test "$(git -C ores-stack hash-object crates/ores-fn-adapters/src/lib.rs)" = "$LIB_BLOB"
          test "$(git -C ores-stack hash-object crates/ores-fn-adapters/src/rpc_http.rs)" = "$RPC_BLOB"
          changed="$(git -C ores-stack diff --name-only | sort)"
          expected=$'crates/ores-fn-adapters/src/lib.rs\ncrates/ores-fn-adapters/src/rpc_http.rs'
          test "$changed" = "$expected"
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy
      - name: Certify exact adapter tree
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          cargo fmt --manifest-path crates/ores-fn-adapters/Cargo.toml -- --check
          cargo check --manifest-path crates/ores-fn-adapters/Cargo.toml --all-targets
          cargo test --manifest-path crates/ores-fn-adapters/Cargo.toml
          cargo clippy --manifest-path crates/ores-fn-adapters/Cargo.toml --all-targets -- -D warnings
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'crates/ores-fn-adapters/src/lib.rs\ncrates/ores-fn-adapters/src/rpc_http.rs'
          test "$changed" = "$expected"
      - name: Guard authority and push certified successor
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)" = "$SOURCE_HEAD"
          test -z "$(git ls-remote origin "refs/heads/$OUTPUT_BRANCH" | cut -f1)" || { echo 'output branch already exists' >&2; exit 1; }
          git config user.name 'ORESoftware CI certification'
          git config user.email 'noreply@oresoftware.com'
          git add crates/ores-fn-adapters/src/lib.rs crates/ores-fn-adapters/src/rpc_http.rs
          git commit -m 'feat(lambda): certify canonical RPC provider HTTP adapter'
          git push origin HEAD:"$OUTPUT_BRANCH"
