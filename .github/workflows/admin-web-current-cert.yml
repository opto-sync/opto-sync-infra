name: admin-web-current-cert

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/admin-web-current-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

jobs:
  exact_head:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURCE_REPO: 'ORESoftware/admin-web-server-template.rs'
      SOURCE_BRANCH: 'feat/middleware-authored-wrapper-20260922'
      SOURCE_HEAD: '0efb4c133fab94b210ad2b9b7b7c364e303b4c06'
    steps:
      - name: Configure private source access
        shell: bash
        env:
          ORE_SOURCE_PAT: '${{ secrets.ORE_SOURCE_PAT }}'
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Fetch exact admin-web PR head
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "https://github.com/${SOURCE_REPO}.git"
          git -C source fetch --depth=1 origin "$SOURCE_BRANCH"
          test "$(git -C source rev-parse FETCH_HEAD)" = "$SOURCE_HEAD"
          git -C source checkout -b certified "$SOURCE_HEAD"
      - name: Certify current head on Rust 1.88
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy
          rustfmt --edition 2024 --config skip_children=true --check src/middleware/mod.rs src/middleware/mw.rs
          cargo check --all-targets
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
          git diff --check
          rm -f Cargo.lock
          test -z "$(git diff --name-only)"
