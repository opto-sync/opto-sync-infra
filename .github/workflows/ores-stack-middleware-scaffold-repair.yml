name: ores-stack-middleware-scaffold-repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-middleware-scaffold-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

jobs:
  repair_and_certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURCE_REPO: 'ORESoftware/ores-stack'
      SOURCE_MAIN: 'f7bf40476916a4283e292a0152a6dd453cf738ce'
      SOURCE_BRANCH: 'fix/web-create-middleware-portable-20260922'
    steps:
      - name: Configure private source access
        shell: bash
        env:
          ORE_SOURCE_PAT: '${{ secrets.ORE_SOURCE_PAT }}'
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Fetch exact current main
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "https://github.com/${SOURCE_REPO}.git"
          git -C source fetch --depth=1 origin main
          test "$(git -C source rev-parse FETCH_HEAD)" = "$SOURCE_MAIN"
          git -C source checkout -b "$SOURCE_BRANCH" "$SOURCE_MAIN"
      - name: Rewrite create-middleware to portable callback boundary
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/ores-stack-cli/src/scaffold_cli.rs')
          s = p.read_text()
          old_const = 'const WEB_MIDDLEWARE_SOURCE: &str = "src/middleware.rs";'
          new_const = '''const WEB_MIDDLEWARE_MOD_SOURCE: &str = "src/middleware/mod.rs";
          const WEB_MIDDLEWARE_IMPL_SOURCE: &str = "src/middleware/mw.rs";'''
          if s.count(old_const) != 1:
              raise SystemExit('unexpected middleware source constant shape')
          s = s.replace(old_const, new_const)
          old = r'''fn create_middleware(args: &[String]) -> Result<(), String> {
              let args = parse_args(args, &["root", "profile"])?;
              let root = canonical_root(args.root.as_deref())?;
              let role = admit_web_repository(&root).map_err(|error| error.to_string())?;
              let profile = args.profile.as_deref().unwrap_or_else(|| {
                  if role.realm() == "admin" {
                      "admin-web"
                  } else {
                      "public-web"
                  }
              });
              validate_token("profile", profile)?;
              let target = root.join(WEB_MIDDLEWARE_SOURCE);
              let source = format!(
                  "//! Repository-owned web middleware composition authority.\n\
                   //!\n\
                   //! Generated standalone/edge adapters consume the same ordered declaration.\n\n\
                   pub const MIDDLEWARE_PROFILE: &str = {profile:?};\n\n\
                   /// Ordered middleware identifiers. Keep this order intentional and stable.\n\
                   pub const MIDDLEWARE_ORDER: &[&str] = &[];\n"
              );
              let mut created = create_new_source(&root, &target, source.as_bytes())?;
              let validation = (|| {
                  format_rust(&root, &[&target])?;
                  created.refresh_expected()?;
                  rustfmt_check(&root, &[&target])
              })();
              if let Err(error) = validation {
                  rollback_created(created)?;
                  return Err(format!(
                      "create-middleware validation failed; scaffold rolled back: {error}"
                  ));
              }
              println!("created {WEB_MIDDLEWARE_SOURCE}");
              println!("profile: {profile}; check: rustfmt");
              Ok(())
          }'''
          new = r'''fn create_middleware(args: &[String]) -> Result<(), String> {
              let args = parse_args(args, &["root", "profile"])?;
              let root = canonical_root(args.root.as_deref())?;
              let role = admit_web_repository(&root).map_err(|error| error.to_string())?;
              let profile = args.profile.as_deref().unwrap_or_else(|| {
                  if role.realm() == "admin" {
                      "admin-web"
                  } else {
                      "public-web"
                  }
              });
              validate_token("profile", profile)?;

              let mod_target = root.join(WEB_MIDDLEWARE_MOD_SOURCE);
              let impl_target = root.join(WEB_MIDDLEWARE_IMPL_SOURCE);
              let mod_source = "//! Application-owned web middleware composition.\n\
                                //!\n\
                                //! Runtime/provider entrypoints are generated by `ores-stack`.\n\n\
                                mod mw;\n\n\
                                pub use mw::{\n\
                                    MIDDLEWARE_ORDER, MIDDLEWARE_PROFILE, P2_PROFILE, configure_backend, edge_minimal,\n\
                                };\n";
              let impl_source = format!(
                  "use ores_middleware::{{\n\
                       EdgeMinimalCallbackArgs, EdgeMinimalDecision, IntegrationError, MiddlewareExecutionProfile,\n\
                       MiddlewareStack,\n\
                   }};\n\n\
                   /// Human-readable repository middleware profile.\n\
                   pub const MIDDLEWARE_PROFILE: &str = {profile:?};\n\n\
                   /// Default local/edge capability profile.\n\
                   pub const P2_PROFILE: MiddlewareExecutionProfile = MiddlewareExecutionProfile::EdgeMinimal;\n\n\
                   /// Ordered backend middleware identifiers. Keep this order intentional and stable.\n\
                   pub const MIDDLEWARE_ORDER: &[&str] = &[];\n\n\
                   /// Provider-neutral request-side middleware for generated P2 wrappers.\n\
                   pub async fn edge_minimal(\n\
                       args: EdgeMinimalCallbackArgs,\n\
                   ) -> Result<EdgeMinimalDecision, IntegrationError> {{\n\
                       Ok(EdgeMinimalDecision::Continue(args.request))\n\
                   }}\n\n\
                   /// Full backend middleware composition for P3/standalone/Lambda only.\n\
                   #[must_use]\n\
                   pub fn configure_backend(stack: MiddlewareStack) -> MiddlewareStack {{\n\
                       stack\n\
                   }}\n"
              );

              let mut mod_created =
                  create_new_source(&root, &mod_target, mod_source.as_bytes())?;
              let mut impl_created =
                  match create_new_source(&root, &impl_target, impl_source.as_bytes()) {
                      Ok(created) => created,
                      Err(error) => {
                          rollback_created(mod_created)?;
                          return Err(error);
                      }
                  };

              let validation: Result<(), String> = (|| {
                  format_rust(&root, &[&mod_target, &impl_target])?;
                  mod_created.refresh_expected()?;
                  impl_created.refresh_expected()?;
                  rustfmt_check(&root, &[&mod_target, &impl_target])
              })();
              if let Err(error) = validation {
                  let mut rollback_errors = Vec::new();
                  if let Err(value) = rollback_created(impl_created) {
                      rollback_errors.push(value);
                  }
                  if let Err(value) = rollback_created(mod_created) {
                      rollback_errors.push(value);
                  }
                  if rollback_errors.is_empty() {
                      return Err(format!(
                          "create-middleware validation failed; scaffold rolled back: {error}"
                      ));
                  }
                  return Err(format!(
                      "create-middleware validation failed: {error}; rollback also failed: {}",
                      rollback_errors.join("; ")
                  ));
              }

              println!("created {WEB_MIDDLEWARE_MOD_SOURCE}");
              println!("created {WEB_MIDDLEWARE_IMPL_SOURCE}");
              println!("profile: {profile}; check: rustfmt; P2: edge_minimal; backend: configure_backend");
              Ok(())
          }'''
          if s.count(old) != 1:
              raise SystemExit('unexpected create_middleware implementation shape')
          s = s.replace(old, new)
          marker = '''    #[test]
              fn parser_rejects_duplicate_and_unknown_flags() {'''
          test = '''    #[test]
              fn middleware_scaffold_targets_portable_module_pair() {
                  assert_eq!(WEB_MIDDLEWARE_MOD_SOURCE, "src/middleware/mod.rs");
                  assert_eq!(WEB_MIDDLEWARE_IMPL_SOURCE, "src/middleware/mw.rs");
              }

          '''
          if s.count(marker) != 1:
              raise SystemExit('unexpected scaffold test insertion point')
          s = s.replace(marker, test + marker)
          p.write_text(s)
          PY
          cargo fmt --all
          git diff --check
          git diff -- crates/ores-stack-cli/src/scaffold_cli.rs
      - name: Certify ores-stack CLI repair
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy
          cargo fmt --all -- --check
          cargo check --locked -p ores-stack-cli --all-targets
          cargo test --locked -p ores-stack-cli scaffold_cli
          cargo clippy --locked -p ores-stack-cli --all-targets -- -D warnings
          grep -Fq 'EdgeMinimalCallbackArgs' crates/ores-stack-cli/src/scaffold_cli.rs
          grep -Fq 'configure_backend' crates/ores-stack-cli/src/scaffold_cli.rs
          grep -Fq 'src/middleware/mod.rs' crates/ores-stack-cli/src/scaffold_cli.rs
          grep -Fq 'src/middleware/mw.rs' crates/ores-stack-cli/src/scaffold_cli.rs
          git diff --check
      - name: Commit and push tested repair
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SOURCE_MAIN"
          existing="$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)"
          test -z "$existing"
          git config user.name 'ORESoftware CI certification'
          git config user.email 'noreply@oresoftware.com'
          git add crates/ores-stack-cli/src/scaffold_cli.rs
          git commit -m 'fix(cli): scaffold portable web middleware module'
          git push origin HEAD:"$SOURCE_BRANCH"
