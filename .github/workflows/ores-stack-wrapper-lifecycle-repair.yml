name: ores-stack-wrapper-lifecycle-repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-wrapper-lifecycle-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
  SOURCE_BRANCH: 'feat/ppr-wrapper-lifecycle-20260922'
  SOURCE_SHA: '142821fc5749a1645387055b3988ba9e739e0220'
  MIDDLEWARE_SHA: '0c29bf0c038b3df8aaaa1a5d3a13bba66b6df52f'
  P2_PROTOCOL_SHA: '142821fc5749a1645387055b3988ba9e739e0220'

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure private source access without URL rewriting
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          git config --global credential.helper '!f() { if [ "$1" = get ]; then echo username=x-access-token; echo "password=$ORE_SOURCE_PAT"; fi; }; f'
      - name: Fetch exact ores-stack source branch
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin "$SOURCE_BRANCH"
          git -C ores-stack checkout -b repair FETCH_HEAD
          test "$(git -C ores-stack rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Apply lifecycle wrapper cutover
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/ores-stack-cli/src/ppr_middleware_wrapper.rs')
          text = path.read_text()
          old_pin = 'const ORES_STACK_P2_PROTOCOL_REV: &str = "ebec1752123b77358342dfb3ca54c16986390501";'
          new_pin = 'const ORES_STACK_P2_PROTOCOL_REV: &str = "142821fc5749a1645387055b3988ba9e739e0220";'
          if text.count(old_pin) != 1:
              raise SystemExit('expected exactly one pre-lifecycle P2 protocol pin')
          if text.count('LocalEdgeMinimalHost') != 3:
              raise SystemExit('unexpected LocalEdgeMinimalHost occurrence count')
          if text.count('run_stdio_once') != 3:
              raise SystemExit('unexpected run_stdio_once occurrence count')
          text = text.replace(old_pin, new_pin, 1)
          text = text.replace('LocalEdgeMinimalHost', 'LocalEdgeMinimalLifecycleHost')
          text = text.replace('run_stdio_once', 'run_stdio_lifecycle')
          path.write_text(text)
          PY
      - name: Install Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy
          rustc --version
          cargo --version
      - name: Verify CLI and wrapper generator
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          rustfmt --edition 2024 crates/ores-stack-cli/src/ppr_middleware_wrapper.rs
          rustfmt --edition 2024 --check crates/ores-stack-cli/src/ppr_middleware_wrapper.rs
          bash scripts/bootstrap-cargo-lock.sh ensure
          cargo check --locked -p ores-stack-cli --all-targets
          RUST_TEST_THREADS=1 cargo test --locked -p ores-stack-cli -- \
            --skip stack_cli_hardened::tests::publication_rolls_back_when_a_later_destination_collides
          cargo clippy --locked -p ores-stack-cli --all-targets -- -D warnings -A dead-code -A unused-imports
          git diff --check
      - name: Generate and compile lifecycle wrapper fixture
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/ppr-wrapper-fixture"
          mkdir -p "$fixture/src/middleware"
          printf 'pub mod mw;\n' > "$fixture/src/middleware/mod.rs"
          cat > "$fixture/src/middleware/mw.rs" <<'RS'
          pub async fn middleware(
              args: ores_middleware::EdgeMinimalCallbackArgs,
          ) -> Result<ores_middleware::EdgeMinimalDecision, ores_middleware::IntegrationError> {
              Ok(ores_middleware::EdgeMinimalDecision::Continue(args.request))
          }
          RS
          cargo run --locked -p ores-stack-cli -- \
            __ppr-generate-middleware-wrapper \
            "--root=$fixture" \
            "--ores-middleware-rev=$MIDDLEWARE_SHA"
          manifest="$fixture/tmp/ores-stack-ppr-middleware/Cargo.toml"
          generated="$fixture/tmp/ores-stack-ppr-middleware/main.rs"
          grep -F "$P2_PROTOCOL_SHA" "$manifest"
          grep -F 'LocalEdgeMinimalLifecycleHost' "$generated"
          grep -F 'run_stdio_lifecycle' "$generated"
          ! grep -F 'LocalEdgeMinimalHost' "$generated"
          ! grep -F 'run_stdio_once' "$generated"
          cargo check --manifest-path "$manifest"
      - name: Guard and push certified source cutover
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          changed="$(git status --porcelain | sed -E 's/^...//' | sort -u)"
          test "$changed" = 'crates/ores-stack-cli/src/ppr_middleware_wrapper.rs'
          remote_head="$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)"
          test "$remote_head" = "$SOURCE_SHA"
          git config user.name 'ORESoftware CI repair'
          git config user.email 'noreply@oresoftware.com'
          git add crates/ores-stack-cli/src/ppr_middleware_wrapper.rs
          git commit -m 'feat(ppr): cut generated P2 wrapper over to lifecycle protocol'
          git push origin HEAD:"$SOURCE_BRANCH"
