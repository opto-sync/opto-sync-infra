name: ores-stack-ppr251-current-main

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-ppr251-current-main.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  EXPECTED_MAIN_SHA: '9114d3db54dc140fbc09f1f7672ba86dc1736c64'
  SOURCE_HEAD: '2af063513e8ddfe05d7e7728509c9382601783fb'
  SOURCE_BRANCH: 'feat/ppr-edge-minimal-wrapper-current3-20260922'
  OUTPUT_BRANCH: 'feat/ppr-edge-minimal-wrapper-certified-main4-20260922'
  ENTRY_BLOB: 'da160774b168c9a0a3047e5eeb4eed01bdc036c1'
  WRAPPER_BLOB: '29c81d7f13b368fa50897db0d246e7982c8bb693'
  MIDDLEWARE_REV: '0c29bf0c038b3df8aaaa1a5d3a13bba66b6df52f'
  PROTOCOL_REV: '9114d3db54dc140fbc09f1f7672ba86dc1736c64'

jobs:
  certify_and_push:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure private source access
        shell: bash
        env:
          ORE_SOURCE_PAT: '${{ secrets.ORE_SOURCE_PAT }}'
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Build current-main successor and repin one middleware ABI
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin "$EXPECTED_MAIN_SHA"
          git -C ores-stack checkout -b certified FETCH_HEAD
          test "$(git -C ores-stack rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          git -C ores-stack fetch --depth=1 origin "$SOURCE_HEAD"
          test "$(git -C ores-stack rev-parse FETCH_HEAD)" = "$SOURCE_HEAD"
          git -C ores-stack show "$SOURCE_HEAD:crates/ores-stack-cli/src/entry.rs" > ores-stack/crates/ores-stack-cli/src/entry.rs
          git -C ores-stack show "$SOURCE_HEAD:crates/ores-stack-cli/src/ppr_middleware_wrapper.rs" > ores-stack/crates/ores-stack-cli/src/ppr_middleware_wrapper.rs
          test "$(git -C ores-stack hash-object crates/ores-stack-cli/src/entry.rs)" = "$ENTRY_BLOB"
          test "$(git -C ores-stack hash-object crates/ores-stack-cli/src/ppr_middleware_wrapper.rs)" = "$WRAPPER_BLOB"
          sed -i "s/b930660d34896db1ab285c3b9bd97deaa37dc9ad/$MIDDLEWARE_REV/g" ores-stack/crates/ores-stack-cli/src/ppr_middleware_wrapper.rs
          sed -i "s/1b2eda561882a38bc30f434810520d9c970810d2/$PROTOCOL_REV/g" ores-stack/crates/ores-stack-cli/src/ppr_middleware_wrapper.rs
          grep -Fq "const ORES_MIDDLEWARE_ABI_REV: &str = \"$MIDDLEWARE_REV\";" ores-stack/crates/ores-stack-cli/src/ppr_middleware_wrapper.rs
          grep -Fq "const ORES_STACK_P2_PROTOCOL_REV: &str = \"$PROTOCOL_REV\";" ores-stack/crates/ores-stack-cli/src/ppr_middleware_wrapper.rs
          grep -Fq "rev = \"$MIDDLEWARE_REV\"" ores-stack/crates/ores-stack-p2-edge-minimal/Cargo.toml
          changed="$(git -C ores-stack diff --name-only | sort)"
          expected=$'crates/ores-stack-cli/src/entry.rs\ncrates/ores-stack-cli/src/ppr_middleware_wrapper.rs'
          test "$changed" = "$expected"
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy
      - name: Certify ores-stack CLI
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          bash scripts/bootstrap-cargo-lock.sh ensure
          cargo check --locked -p ores-stack-cli --all-targets
          cargo test --locked -p ores-stack-cli
          cargo clippy --locked -p ores-stack-cli --all-targets -- -D warnings
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'crates/ores-stack-cli/src/entry.rs\ncrates/ores-stack-cli/src/ppr_middleware_wrapper.rs'
          test "$changed" = "$expected"
      - name: Generate and compile isolated wrapper fixture
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/ppr-wrapper-fixture"
          mkdir -p "$fixture/src/middleware"
          printf 'pub mod mw;\n' > "$fixture/src/middleware/mod.rs"
          cat > "$fixture/src/middleware/mw.rs" <<'RS'
          pub async fn middleware(
              args: ores_middleware::EdgeMinimalCallbackArgs,
          ) -> Result<ores_middleware::EdgeMinimalDecision, ores_middleware::IntegrationError> {
              Ok(ores_middleware::EdgeMinimalDecision::Continue(args.request))
          }
          RS
          cargo run --locked -p ores-stack-cli --bin ores-stack -- \
            __ppr-generate-middleware-wrapper \
            "--root=$fixture" \
            "--ores-middleware-rev=$MIDDLEWARE_REV"
          manifest="$fixture/tmp/ores-stack-ppr-middleware/Cargo.toml"
          test -f "$manifest"
          grep -Fq "rev = \"$MIDDLEWARE_REV\"" "$manifest"
          grep -Fq "rev = \"$PROTOCOL_REV\"" "$manifest"
          cargo check --manifest-path "$manifest" --all-targets
          lock="$fixture/tmp/ores-stack-ppr-middleware/Cargo.lock"
          test -s "$lock"
          test "$(grep -F -c 'name = \"ores-middleware\"' "$lock")" = '1'
          grep -Fq "git+https://github.com/ORESoftware/ores-middleware.git?rev=$MIDDLEWARE_REV#$MIDDLEWARE_REV" "$lock"
      - name: Guard authority and push certified successor
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)" = "$SOURCE_HEAD"
          test -z "$(git ls-remote origin "refs/heads/$OUTPUT_BRANCH" | cut -f1)" || { echo 'output branch already exists' >&2; exit 1; }
          git config user.name 'ORESoftware CI certification'
          git config user.email 'noreply@oresoftware.com'
          git add crates/ores-stack-cli/src/entry.rs crates/ores-stack-cli/src/ppr_middleware_wrapper.rs
          git commit -m 'feat(ppr): certify generated edge-minimal middleware wrapper'
          git push origin HEAD:"$OUTPUT_BRANCH"
