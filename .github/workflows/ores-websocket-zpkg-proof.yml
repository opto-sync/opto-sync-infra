name: ores-websocket-zpkg-proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-websocket-zpkg-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REPO: ORESoftware/ores-websocket
  SOURCE_BRANCH: fix/zpkg-universal-language-20260922
  SOURCE_SHA: '6d36f70197c0b047c8d7b12d5ad44e861716a8b7'
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure private source access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Fetch exact websocket candidate
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "https://github.com/${SOURCE_REPO}.git"
          git -C source fetch --depth=1 origin "$SOURCE_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote "https://github.com/${SOURCE_REPO}.git" "refs/heads/${SOURCE_BRANCH}" | cut -f1)" = "$SOURCE_SHA"
          grep -Fx 'language = "universal"' source/.zpkg.toml
          ! grep -Fx 'language = "multi"' source/.zpkg.toml

      - name: Install Rust 1.88 and Node 22.9.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.9.0'

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy

      - name: Parse and materialize the corrected Zed package
        shell: bash
        working-directory: source
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
          ZED_PKG_GITHUB_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
          GH_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          cargo install --git https://github.com/zed-pkg/zed-cli \
            --rev 344d432a6f94d4b1cfa02228ec36623c7484177a --locked zed-cli
          zed install --allow-build --install-mode copy
          test -d .vendor/.zed

      - name: Run exact source CI surface
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --all-features
          cargo clippy --all-targets --all-features -- -D warnings
          npm install --ignore-scripts
          npm run check
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$(git ls-remote "https://github.com/${SOURCE_REPO}.git" "refs/heads/${SOURCE_BRANCH}" | cut -f1)" = "$SOURCE_SHA"
