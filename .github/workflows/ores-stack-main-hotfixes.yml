name: ores-stack-main-hotfixes

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-main-hotfixes.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

jobs:
  ppr_ingress:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OUTPUT_BRANCH: 'fix/ppr-request-ingress-compile-current-main-20260922'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: Configure private source access
        shell: bash
        env: { ORE_SOURCE_PAT: '${{ secrets.ORE_SOURCE_PAT }}' }
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Fetch current ores-stack main
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin main
          git -C ores-stack checkout -b repair FETCH_HEAD
      - name: Apply lifetime fix and format
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          file='crates/ores-stack-ppr-http/src/request.rs'
          old='with_tcp_deadline(stream, deadline, read_request_head)'
          new='with_tcp_deadline(stream, deadline, |reader| read_request_head(reader))'
          test "$(grep -F -c "$old" "$file")" = '1'
          sed -i "s#${old}#${new}#" "$file"
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy
          rustfmt --edition 2024 crates/ores-stack-ppr-http/src/lib_strict.rs crates/ores-stack-ppr-http/src/request.rs
          git diff --check
      - name: Run PPR checks with retained logs
        shell: bash
        working-directory: ores-stack
        run: |
          set -u
          OUT="$RUNNER_TEMP/ppr-hotfix"
          mkdir -p "$OUT"
          set +e
          bash scripts/bootstrap-cargo-lock.sh ensure >"$OUT/bootstrap.log" 2>&1; boot=$?
          cargo check --locked -p ores-stack-ppr-http --all-targets >"$OUT/check.log" 2>&1; check=$?
          if [ "$check" -eq 0 ]; then cargo test --locked -p ores-stack-ppr-http >"$OUT/test.log" 2>&1; test=$?; else test=99; fi
          if [ "$test" -eq 0 ]; then cargo clippy --locked -p ores-stack-ppr-http --all-targets -- -D warnings >"$OUT/clippy.log" 2>&1; clippy=$?; else clippy=99; fi
          git diff --name-only | sort >"$OUT/changed-files.txt"
          git diff --binary >"$OUT/patch.diff"
          printf 'bootstrap=%s\ncheck=%s\ntest=%s\nclippy=%s\n' "$boot" "$check" "$test" "$clippy" >"$OUT/result.txt"
          exit 0
      - name: Upload PPR evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ores-stack-ppr-main-hotfix
          path: ${{ runner.temp }}/ppr-hotfix
          retention-days: 7
      - name: Gate and push PPR hotfix
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ppr-hotfix"
          cat "$OUT/result.txt"
          grep -qx 'bootstrap=0' "$OUT/result.txt"
          grep -qx 'check=0' "$OUT/result.txt"
          grep -qx 'test=0' "$OUT/result.txt"
          grep -qx 'clippy=0' "$OUT/result.txt"
          changed="$(cat "$OUT/changed-files.txt")"
          expected=$'crates/ores-stack-ppr-http/src/lib_strict.rs\ncrates/ores-stack-ppr-http/src/request.rs'
          test "$changed" = "$expected"
          git config user.name 'ORESoftware CI repair'
          git config user.email 'noreply@oresoftware.com'
          git add crates/ores-stack-ppr-http/src/lib_strict.rs crates/ores-stack-ppr-http/src/request.rs
          git commit -m 'fix(ppr): repair request-ingress deadline reader and formatting'
          test -z "$(git ls-remote origin "refs/heads/$OUTPUT_BRANCH" | cut -f1)" || { echo 'output branch exists' >&2; exit 1; }
          git push origin HEAD:"$OUTPUT_BRANCH"

  adapter_clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OUTPUT_BRANCH: 'fix/fn-adapters-clippy-baseline-20260922'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: Configure private source access
        shell: bash
        env: { ORE_SOURCE_PAT: '${{ secrets.ORE_SOURCE_PAT }}' }
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Fetch current ores-stack main
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin main
          git -C ores-stack checkout -b repair FETCH_HEAD
      - name: Apply narrow strict-Clippy baseline fixes
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          reply='crates/ores-fn-adapters/src/reply.rs'
          http='crates/ores-fn-adapters/src/http_call.rs'
          test "$(grep -F -c 'DispatchError, OperationDispatchResult, OperationHostError, RpcV1Receipt,' "$reply")" = '1'
          sed -i 's/DispatchError, OperationDispatchResult, OperationHostError, RpcV1Receipt,/DispatchError, OperationDispatchResult, OperationHostError,/' "$reply"
          old='    let mut best: Option<(Vec<u8>, u8, &HttpRoute, Map<String, Value>)> = None;'
          test "$(grep -F -c "$old" "$http")" = '1'
          sed -i '/^fn resolve<'"'"'r>(/i type RouteMatch<'"'"'r> = (Vec<u8>, u8, &'"'"'r HttpRoute, Map<String, Value>);\n' "$http"
          sed -i "s#${old}#    let mut best: Option<RouteMatch<'r>> = None;#" "$http"
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy
          rustfmt --edition 2024 "$reply" "$http"
          git diff --check
      - name: Run adapter checks with retained logs
        shell: bash
        working-directory: ores-stack
        run: |
          set -u
          OUT="$RUNNER_TEMP/adapter-hotfix"
          mkdir -p "$OUT"
          set +e
          cargo check --manifest-path crates/ores-fn-adapters/Cargo.toml --all-targets >"$OUT/check.log" 2>&1; check=$?
          if [ "$check" -eq 0 ]; then cargo test --manifest-path crates/ores-fn-adapters/Cargo.toml >"$OUT/test.log" 2>&1; test=$?; else test=99; fi
          if [ "$test" -eq 0 ]; then cargo clippy --manifest-path crates/ores-fn-adapters/Cargo.toml --all-targets -- -D warnings >"$OUT/clippy.log" 2>&1; clippy=$?; else clippy=99; fi
          git diff --name-only | sort >"$OUT/changed-files.txt"
          git diff --binary >"$OUT/patch.diff"
          printf 'check=%s\ntest=%s\nclippy=%s\n' "$check" "$test" "$clippy" >"$OUT/result.txt"
          exit 0
      - name: Upload adapter evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ores-stack-adapter-main-hotfix
          path: ${{ runner.temp }}/adapter-hotfix
          retention-days: 7
      - name: Gate and push adapter hotfix
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/adapter-hotfix"
          cat "$OUT/result.txt"
          grep -qx 'check=0' "$OUT/result.txt"
          grep -qx 'test=0' "$OUT/result.txt"
          grep -qx 'clippy=0' "$OUT/result.txt"
          changed="$(cat "$OUT/changed-files.txt")"
          expected=$'crates/ores-fn-adapters/src/http_call.rs\ncrates/ores-fn-adapters/src/reply.rs'
          test "$changed" = "$expected"
          git config user.name 'ORESoftware CI repair'
          git config user.email 'noreply@oresoftware.com'
          git add crates/ores-fn-adapters/src/http_call.rs crates/ores-fn-adapters/src/reply.rs
          git commit -m 'fix(lambda): make provider adapter strict Clippy clean'
          test -z "$(git ls-remote origin "refs/heads/$OUTPUT_BRANCH" | cut -f1)" || { echo 'output branch exists' >&2; exit 1; }
          git push origin HEAD:"$OUTPUT_BRANCH"
