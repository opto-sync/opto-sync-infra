name: ores-stack-p2-lifecycle-immutable

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-p2-lifecycle-immutable.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  SOURCE_SHA: 'abfb13e1c76b9d20711143cd669c9eb29ac0fb0f'

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure private source access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Fetch immutable ores-stack candidate
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin "$SOURCE_SHA"
          git -C ores-stack checkout --detach FETCH_HEAD
          test "$(git -C ores-stack rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Install Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy
          rustc --version
          cargo --version
      - name: Verify exact P2 lifecycle head
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check crates/ores-stack-p2-edge-minimal/src/lib.rs
          bash scripts/bootstrap-cargo-lock.sh ensure
          cargo check --locked -p ores-stack-p2-edge-minimal --all-targets
          cargo test --locked -p ores-stack-p2-edge-minimal
          cargo clippy --locked -p ores-stack-p2-edge-minimal --all-targets -- -D warnings
          git diff --check
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
