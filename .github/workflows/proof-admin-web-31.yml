name: proof admin-web #31 exact head

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/proof-admin-web-31.yml

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: 0efb4c133fab94b210ad2b9b7b7c364e303b4c06
      SOURCE_BASE: de237ec1a7809f1528f274b2a4cadf6c6483700b
      SOURCE_BRANCH: feat/middleware-authored-wrapper-20260922
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require source token
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: test -n "$ORE_SOURCE_PAT"
      - name: Checkout exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/admin-web-server-template.rs
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - name: Guard exact review surface
        working-directory: subject
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git cat-file -e "$SOURCE_BASE^{commit}"
          git diff --check "$SOURCE_BASE"..HEAD
          test "$(git diff --name-only "$SOURCE_BASE"..HEAD | sort)" = "$(printf '%s\n' Cargo.toml docs/middleware-wrapper.md src/lib.rs src/middleware/README.md src/middleware/mod.rs src/middleware/mw.rs | sort)"
          grep -F 'rev = "0c29bf0c038b3df8aaaa1a5d3a13bba66b6df52f"' Cargo.toml
          grep -F 'MiddlewareExecutionProfile::EdgeMinimal' src/middleware/mw.rs
          grep -F 'pub async fn edge_minimal' src/middleware/mw.rs
          grep -F 'pub async fn p2_after' src/middleware/mw.rs
          grep -F 'pub fn configure_backend' src/middleware/mw.rs
          remote=$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/ORESoftware/admin-web-server-template.rs.git" "refs/heads/${SOURCE_BRANCH}" | cut -f1)
          test "$remote" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
      - name: Install Rust 1.88
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
      - name: Configure private Git reads
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
          echo 'CARGO_NET_GIT_FETCH_WITH_CLI=true' >> "$GITHUB_ENV"
      - name: Materialize pinned Zed dependencies
        working-directory: subject
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo install --git https://github.com/zed-pkg/zed-cli --rev 344d432a6f94d4b1cfa02228ec36623c7484177a --locked zed-cli
          zed install --allow-build --install-mode copy
          test -f .vendor/.zed/oresoftware/ores-sw/rust/axum08.rs
      - name: Format PR-owned middleware Rust
        working-directory: subject
        run: rustfmt --edition 2024 --check src/middleware/mod.rs src/middleware/mw.rs
      - name: Server-layout conformance
        working-directory: subject
        run: cargo run --locked --quiet --bin check-server-layout
      - name: Test all targets
        working-directory: subject
        run: cargo test --all-targets --locked
      - name: Strict Clippy
        working-directory: subject
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Final immutable-source guard
        if: always()
        working-directory: subject
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          remote=$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/ORESoftware/admin-web-server-template.rs.git" "refs/heads/${SOURCE_BRANCH}" | cut -f1)
          test "$remote" = "$SOURCE_SHA"
          git diff --exit-code
