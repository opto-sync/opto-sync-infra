name: proof worker #74 provenance workspace

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/proof-worker-74-provenance.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proof-worker-74-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      K8S_PROVENANCE_COMMIT: 5cfac43c6900898f36f588d044ca34083da1c726
      LIBS_PROVENANCE_COMMIT: 84d565eeb7e1e78ce0851a2e3c95966e5cc12e36
      WORKER_SHA: b75aed10acad716993845d328f5166abcd525f01
      WORKER_PATH: workspace/remote/deployments/build-server-rs
      CARGO_TERM_COLOR: always
    steps:
      - name: Require scoped ORE source PAT
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"

      - name: Recreate immutable k8s source workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/k8s-cluster
          ref: ${{ env.K8S_PROVENANCE_COMMIT }}
          persist-credentials: false
          path: workspace

      - name: Materialize exact private libs gitlink
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/k8s-libs-and-shared-defs
          ref: ${{ env.LIBS_PROVENANCE_COMMIT }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          path: workspace/remote/libs

      - name: Remove historical worker snapshot
        shell: bash
        run: rm -rf "$WORKER_PATH"

      - name: Overlay exact production worker head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gha-indie-worker/gha-indie-worker.rs
          ref: ${{ env.WORKER_SHA }}
          persist-credentials: false
          path: ${{ env.WORKER_PATH }}

      - name: Guard immutable source graph
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C workspace rev-parse HEAD)" = "$K8S_PROVENANCE_COMMIT"
          test "$(git -C workspace/remote/libs rev-parse HEAD)" = "$LIBS_PROVENANCE_COMMIT"
          test "$(git -C "$WORKER_PATH" rev-parse HEAD)" = "$WORKER_SHA"
          test -f "$WORKER_PATH/Cargo.toml"
          test -f workspace/remote/libs/telemetry-rs/Cargo.toml
          test -f workspace/remote/libs/runtime-config-client-rs/Cargo.toml
          test -f workspace/remote/libs/nats/subject-defs/generated/rust/Cargo.toml
          grep -F 'ORESoftware/k8s-cluster' "$WORKER_PATH/SOURCE_PROVENANCE.md"
          grep -F "$K8S_PROVENANCE_COMMIT" "$WORKER_PATH/SOURCE_PROVENANCE.md"

      - name: Install Rust 1.90.0
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.90.0
          components: rustfmt,clippy

      - name: Format exact worker head
        shell: bash
        run: cargo fmt --manifest-path "$WORKER_PATH/Cargo.toml" --all -- --check

      - name: Test exact worker head with locked provenance graph
        shell: bash
        run: cargo test --locked --manifest-path "$WORKER_PATH/Cargo.toml" --bins

      - name: Clippy exact worker head with locked provenance graph
        shell: bash
        run: cargo clippy --locked --manifest-path "$WORKER_PATH/Cargo.toml" --bins -- -D warnings

      - name: Source drift guard
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git -C "$WORKER_PATH" status --short)"
          echo WORKER_74_PROVENANCE_PROOF_PASS
