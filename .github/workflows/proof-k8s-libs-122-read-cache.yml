name: proof k8s-libs #122 read-cache collector

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/proof-k8s-libs-122-read-cache.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proof-k8s-libs-122-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: f20cfcd3afe571d67719e2a37ca02f0e1c44b8c3
    steps:
      - name: Require scoped source PAT
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"

      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/k8s-libs-and-shared-defs
          ref: f20cfcd3afe571d67719e2a37ca02f0e1c44b8c3
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 1

      - name: Guard exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --short)"

      - name: Install Rust 1.85.0
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.85.0
          components: rustfmt

      - name: Check formatting
        run: rustfmt --edition 2021 --check tools/read-cache-inventory.rs

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2021 -D warnings --test tools/read-cache-inventory.rs -o "$RUNNER_TEMP/read-cache-inventory-tests"
          "$RUNNER_TEMP/read-cache-inventory-tests"

      - name: Build standalone collector
        run: rustc --edition=2021 -D warnings tools/read-cache-inventory.rs -o "$RUNNER_TEMP/read-cache-inventory"

      - name: Prove env-only configuration fails closed
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$($RUNNER_TEMP/read-cache-inventory 2>&1)"
          status=$?
          set -e
          test "$status" -eq 2
          test "$output" = "READ_CACHE_DATABASE_URL_MISSING"
          set +e
          output="$($RUNNER_TEMP/read-cache-inventory unexpected-arg 2>&1)"
          status=$?
          set -e
          test "$status" -eq 2
          test "$output" = "READ_CACHE_INVENTORY_NO_CLI_ARGS"

      - name: Source drift guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --short)"
          echo K8S_LIBS_122_READ_CACHE_PROOF_PASS
